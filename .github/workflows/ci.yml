
name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v3

    - name: Configurar Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compilar Servicio Identidad
      run: cd Backend/servicio_identidad && mvn clean install

    - name: Compilar Servicio Autorizacion
      run: cd Backend/servicio_autorizacion && mvn clean install

    - name: Compilar Servicio Auditoria
      run: cd Backend/servicio_auditoria && mvn clean install

    - name: Compilar API Gateway
      run: cd Backend/api_gateway && mvn clean install
# Puerto del servicio
server.port=8085

# Nombre de la aplicacion
spring.application.name=servicio-reportes

# Configuracion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/servicio_reporte_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Endpoints de los otros servicios
servicio.auditoria.url=http://localhost:8081
servicio.identidad.url=http://localhost:8082
servicio.autorizacion.url=http://localhost:8083
